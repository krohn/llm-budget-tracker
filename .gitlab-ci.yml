workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  SCHEME: LLMBudgetTracker
  APP_NAME: LLMBudgetTracker
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  GIT_DEPTH: "1"

stages:
  - lint
  - test
  - release

# Requires a macOS shell runner with Xcode and Homebrew, registered with the tag "macos".
default:
  tags:
    - macos
  interruptible: true

lint:
  stage: lint
  script:
    - command -v swiftlint || brew install swiftlint
    - swiftlint version
    - swiftlint lint --strict

test:
  stage: test
  needs: []
  script:
    - command -v xcodegen || brew install xcodegen
    - xcodebuild -version
    - xcodegen generate
    - >
      xcodebuild test
      -project "${APP_NAME}.xcodeproj"
      -scheme "$SCHEME"
      -configuration Debug
      -destination "platform=macOS"
      CODE_SIGNING_ALLOWED=NO

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  interruptible: false
  script:
    - command -v xcodegen || brew install xcodegen
    - command -v gh || brew install gh
    - ./scripts/publish-release.sh
